<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <radialGradient id="studio-bg-f" cx="50%" cy="36%" r="65%">
      <stop offset="0%" stop-color="#3f3f46"/>
      <stop offset="50%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#09090b"/>
    </radialGradient>
    <linearGradient id="suit-grad-f" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="lapel-grad-f" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#52525b"/>
      <stop offset="100%" stop-color="#27272a"/>
    </linearGradient>
    <linearGradient id="hijab-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3f3f46"/>
      <stop offset="100%" stop-color="#27272a"/>
    </linearGradient>
    <linearGradient id="skin-grad-f" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f4f4f5"/>
      <stop offset="100%" stop-color="#d4d4d8"/>
    </linearGradient>
  </defs>

  <!-- Rectangular Studio Portrait Background (4:5 Ratio) -->
  <rect width="400" height="500" fill="url(#studio-bg-f)"/>

  <!-- Soft Studio Spotlight Halo -->
  <circle cx="200" cy="190" r="150" fill="#ffffff" opacity="0.04"/>

  <!-- Female Professional Figure Silhouette -->
  <!-- Shoulders / Blazer Body -->
  <path d="M 40 500 C 40 385, 105 330, 200 330 C 295 330, 360 385, 360 500 Z" fill="url(#suit-grad-f)"/>

  <!-- Hijab Outer Flow -->
  <path d="M 125 210 C 120 115, 150 85, 200 85 C 250 85, 280 115, 275 210 C 272 270, 285 360, 255 435 C 235 460, 165 460, 145 435 C 115 360, 128 270, 125 210 Z" fill="url(#hijab-grad)"/>

  <!-- Inner Hijab Frame -->
  <path d="M 140 205 C 140 135, 165 110, 200 110 C 235 110, 260 135, 260 205 C 258 245, 238 275, 200 275 C 162 275, 142 245, 140 205 Z" fill="#18181b"/>

  <!-- Face Oval -->
  <ellipse cx="200" cy="195" rx="42" ry="54" fill="url(#skin-grad-f)"/>

  <!-- Hijab Drape Under Chin -->
  <path d="M 158 228 C 170 258, 230 258, 242 228 C 248 252, 236 280, 200 280 C 164 280, 152 252, 158 228 Z" fill="#27272a"/>

  <!-- Inner Blouse / Shirt -->
  <polygon points="200,430 165,345 235,345" fill="#f8fafc"/>

  <!-- Blazer Lapels -->
  <polygon points="120,355 178,470 178,350 148,335" fill="url(#lapel-grad-f)"/>
  <polygon points="280,355 222,470 222,350 252,335" fill="url(#lapel-grad-f)"/>
</svg>