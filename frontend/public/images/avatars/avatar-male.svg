<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <radialGradient id="studio-bg" cx="50%" cy="36%" r="65%">
      <stop offset="0%" stop-color="#3f3f46"/>
      <stop offset="50%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#09090b"/>
    </radialGradient>
    <linearGradient id="suit-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="lapel-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#52525b"/>
      <stop offset="100%" stop-color="#27272a"/>
    </linearGradient>
    <linearGradient id="skin-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f4f4f5"/>
      <stop offset="100%" stop-color="#d4d4d8"/>
    </linearGradient>
    <linearGradient id="shadow-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a1a1aa"/>
      <stop offset="100%" stop-color="#71717a"/>
    </linearGradient>
  </defs>

  <!-- Rectangular Studio Portrait Background (4:5 Ratio) -->
  <rect width="400" height="500" fill="url(#studio-bg)"/>

  <!-- Soft Studio Spotlight Halo -->
  <circle cx="200" cy="190" r="150" fill="#ffffff" opacity="0.04"/>

  <!-- Male Professional Figure Silhouette -->
  <!-- Shoulders / Suit Body -->
  <path d="M 30 500 C 30 380, 100 320, 200 320 C 300 320, 370 380, 370 500 Z" fill="url(#suit-grad)"/>

  <!-- Inner Formal Shirt -->
  <polygon points="200,410 150,305 250,305" fill="#f8fafc"/>

  <!-- Tie -->
  <polygon points="193,325 207,325 212,440 200,465 188,440" fill="#18181b"/>
  <polygon points="192,315 208,315 205,330 195,330" fill="#27272a"/>

  <!-- Suit Lapels -->
  <polygon points="110,340 172,460 172,335 140,320" fill="url(#lapel-grad)"/>
  <polygon points="290,340 228,460 228,335 260,320" fill="url(#lapel-grad)"/>

  <!-- Neck -->
  <rect x="176" y="235" width="48" height="75" rx="10" fill="url(#skin-grad)"/>
  <path d="M 176 280 C 190 295, 210 295, 224 280 L 224 310 L 176 310 Z" fill="url(#shadow-grad)" opacity="0.4"/>

  <!-- Ears -->
  <ellipse cx="138" cy="195" rx="10" ry="18" fill="url(#skin-grad)"/>
  <ellipse cx="262" cy="195" rx="10" ry="18" fill="url(#skin-grad)"/>

  <!-- Head / Face Oval -->
  <ellipse cx="200" cy="190" rx="56" ry="70" fill="url(#skin-grad)"/>

  <!-- Modern Professional Haircut -->
  <path d="M 136 185 C 132 110, 160 90, 200 90 C 242 90, 268 110, 264 185 C 255 140, 238 120, 200 120 C 160 120, 145 140, 136 185 Z" fill="#18181b"/>
  <path d="M 138 180 C 135 130, 160 100, 200 100 C 240 100, 265 130, 262 180 C 255 145, 235 130, 200 130 C 165 130, 145 145, 138 180 Z" fill="#27272a"/>
</svg>